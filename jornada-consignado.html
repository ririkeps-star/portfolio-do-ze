<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jornada de empréstimo consignado</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d6ece3;--ink:#1d3a31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#fit{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--ink)}
.scr{position:relative;width:400px;height:866px;border-radius:40px;overflow:hidden;background:#fff;box-shadow:0 50px 90px -40px rgba(50,100,85,.35)}
.s{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.s.on{opacity:1}
.in{position:relative;width:100%;transition:transform 1.8s cubic-bezier(.45,0,.2,1)}
.in img{display:block;width:100%}
.tap{position:absolute;width:64px;height:64px;margin:-32px;border-radius:50%;background:rgba(29,163,129,.28);animation:rip .9s ease-out forwards;pointer-events:none}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
#main{position:absolute;left:760px;top:64px;transition:opacity 1s,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#main.hide{opacity:0;transform:translateY(40px)}
#cap{position:absolute;left:0;right:0;top:972px;text-align:center;font-size:26px;letter-spacing:.01em;transition:opacity .6s}
#cap i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.2;margin:0 6px;transition:opacity .5s}
#cap i.on{opacity:1}
#cap p{margin:0 0 18px;height:34px}
#fin{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;pointer-events:none}
#fin.show{opacity:1}
#fin h2{position:absolute;left:0;right:0;top:940px;margin:0;text-align:center;font-weight:400;font-size:26px;letter-spacing:.01em}
.mini{position:absolute;top:190px;opacity:0;transform:translateY(40px);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.8,.2,1)}
.mini .scr{transform:scale(.75);transform-origin:0 0}
.mini .s{opacity:1;transition:none}
#fin.show .mini{opacity:1;transform:none}
</style></head><body>
<div id="fit">
<div id="main" class="hide"><div class="scr" id="scr"></div></div>
<div id="cap"><p id="capt"></p><i></i><i></i><i></i><i></i><i></i></div>
<div id="fin"><div id="row"></div><h2>Empréstimo consignado</h2></div>
</div>

const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const keys=['hub','l1','l2','l3','ck','inp','ok'];
const names=['Hub de empréstimos','Análise em 3 etapas','Oferta','Ajuste de valor','Pedido concluído'];
const dots=[...document.querySelectorAll('#cap i')];
function setStep(i){dots.forEach((d,j)=>d.classList.toggle('on',i===j));$('capt').textContent=names[i]}
function mk(k){const d=document.createElement('div');d.className='s';d.dataset.k=k;d.innerHTML=`<div class="in"><img alt="${k}" src="data:image/webp;base64,${IMG[k]}"></div>`;return d}
const scr=$('scr');keys.forEach(k=>scr.appendChild(mk(k)));
const el=k=>scr.querySelector(`[data-k=${k}]`),inn=k=>el(k).querySelector('.in');
let cur=null;
function show(k){if(cur)el(cur).classList.remove('on');el(k).classList.add('on');cur=k}
const maxS=k=>Math.max(0,inn(k).offsetHeight-866);
const scroll=(k,y)=>inn(k).style.transform=`translateY(${-y}px)`;
function tap(k,x,y){const t=document.createElement('div');t.className='tap';t.style.left=x+'%';t.style.top=y+'%';inn(k).appendChild(t);setTimeout(()=>t.remove(),950)}
const row=$('row');
['hub','l2','ck','inp','ok'].forEach((k,i)=>{const m=document.createElement('div');m.className='mini';m.style.left=(82+i*364)+'px';m.style.transitionDelay=(i*.15)+'s';
 m.innerHTML='<div class="scr"></div>';m.firstChild.appendChild(mk(k));row.appendChild(m)});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);$('fit').style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();
async function run(){
 const main=$('main'),fin=$('fin'),cap=$('cap');
 for(;;){
  keys.forEach(k=>{inn(k).style.transition='none';scroll(k,0);void inn(k).offsetHeight;inn(k).style.transition=''});
  fin.classList.remove('show');cap.style.opacity=1;
  show('hub');setStep(0);main.classList.remove('hide');await sleep(1500);
  scroll('hub',700);await sleep(2300);scroll('hub',0);await sleep(2000);
  tap('hub',22,23.9);await sleep(900);
  show('l1');setStep(1);await sleep(1800);show('l2');await sleep(1800);show('l3');await sleep(1800);
  show('ck');setStep(2);await sleep(2200);tap('ck',86.4,26.4);await sleep(900);
  show('inp');setStep(3);await sleep(2400);tap('inp',50,61.2);await sleep(900);
  show('ck');setStep(2);await sleep(1800);tap('ck',50.3,95.2);await sleep(900);
  show('ok');setStep(4);await sleep(3200);
  main.classList.add('hide');cap.style.opacity=0;await sleep(900);
  fin.classList.add('show');await sleep(6500);
  fin.classList.remove('show');await sleep(1400);
 }
}
addEventListener('load',()=>setTimeout(run,300));
</script></body></html>
